<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>알로하 수업 일정</title>
<meta name="description" content="알로하다이빙 프리다이빙 수업 일정·가격·후기 — 성남 아쿠아라인·용인 딥스테이션, 남은 자리 확인하고 바로 신청하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="알로하다이빙 · 프리다이빙 수업">
<meta property="og:description" content="수업 일정·가격·후기 — 성남 아쿠아라인·용인 딥스테이션. 남은 자리 확인하고 바로 신청하세요. / Freediving classes, prices & booking.">
<meta name="theme-color" content="#0D7C8A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F4F8F9; --surface:#FFFFFF; --ink:#0A2130; --muted:#5C7A86; --faint:#A2B4BB;
  --line:#DCE7EB; --line-soft:#E9EFF1;
  --sn:#0D7C8A; --sn-tint:#E6F4F5; --sn-ink:#0A5760;
  --yi:#3557A8; --yi-tint:#E9EEF9; --yi-ink:#27427F;
  --cta:#F0A202; --cta-ink:#2A1C00;
  --off-bg:#F2F1F7; --off-line:#DFDCEA; --off-ink:#8F86AF;
  --shut-bg:#F7F4EE; --shut-line:#E8DFCF; --shut-ink:#9C8B5E;
  --past:#EDF2F4; --sun:#C25450; --sat:#3C74B8;
  --shadow:0 18px 50px rgba(10,33,48,.18); --on-accent:#FFFFFF;
  --wait-bg:#FFF3D1; --wait-ink:#8A5A00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A22; --surface:#11252F; --ink:#E4EEF1; --muted:#8FA9B3; --faint:#557480;
    --line:#1F3A46; --line-soft:#18303A;
    --sn:#3FB4C2; --sn-tint:#0F343A; --sn-ink:#8FDCE5;
    --yi:#7E9BE0; --yi-tint:#1A2748; --yi-ink:#B9CAF2;
    --cta:#F5B434; --cta-ink:#2A1C00;
    --off-bg:#1C1B2A; --off-line:#2C2A42; --off-ink:#A79FD0;
    --shut-bg:#231F16; --shut-line:#3A3222; --shut-ink:#C4B289;
    --past:#0E2029; --sun:#E0827E; --sat:#7FA6DC;
    --shadow:0 18px 50px rgba(0,0,0,.5); --on-accent:#05202A;
    --wait-bg:#33280F; --wait-ink:#F5C66A;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1A22; --surface:#11252F; --ink:#E4EEF1; --muted:#8FA9B3; --faint:#557480;
  --line:#1F3A46; --line-soft:#18303A;
  --sn:#3FB4C2; --sn-tint:#0F343A; --sn-ink:#8FDCE5;
  --yi:#7E9BE0; --yi-tint:#1A2748; --yi-ink:#B9CAF2;
  --cta:#F5B434; --cta-ink:#2A1C00;
  --off-bg:#1C1B2A; --off-line:#2C2A42; --off-ink:#A79FD0;
  --shut-bg:#231F16; --shut-line:#3A3222; --shut-ink:#C4B289;
  --past:#0E2029; --sun:#E0827E; --sat:#7FA6DC;
  --shadow:0 18px 50px rgba(0,0,0,.5); --on-accent:#05202A;
    --wait-bg:#33280F; --wait-ink:#F5C66A;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:880px; margin:0 auto; padding-inline:16px; padding-block:22px calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){ .wrap{padding-block:22px 64px} }

/* ---------- main menu: bottom bar on phones, top bar on wide screens ---------- */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; justify-content:space-around;
  background:var(--surface); border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1; min-width:0; border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:11px; font-weight:700; letter-spacing:-.02em; color:var(--muted); padding:4px 0; border-radius:10px}
.tabbar svg{width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--sn)}
.tabbar button[aria-current="page"] svg{stroke-width:2.3}
@media (min-width:720px){
  .tabbar{position:sticky; top:env(safe-area-inset-top,0px); bottom:auto; justify-content:center; gap:4px;
    border-top:0; border-bottom:1px solid var(--line); padding:8px 16px}
  .tabbar button{flex:none; flex-direction:row; gap:7px; font-size:14px; padding:8px 14px}
  .tabbar svg{width:18px; height:18px}
  .tabbar button[aria-current="page"]{background:var(--sn-tint); color:var(--sn-ink)}
}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:2.5px solid var(--sn); outline-offset:2px}

/* ---------- header ---------- */
.top{display:flex; justify-content:space-between; align-items:center; gap:12px}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.16em; color:var(--sn)}
.lang{display:flex; border:1px solid var(--line); border-radius:999px; background:var(--surface); padding:2px}
.lang button{border:0; background:transparent; font-size:12px; font-weight:700; letter-spacing:.06em;
  padding:5px 11px; border-radius:999px; color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}

.head{margin-top:14px}
h1{font-size:clamp(30px,7vw,44px); font-weight:900; letter-spacing:-.035em; line-height:1.05; margin:0; text-wrap:balance}
h1 em{font-style:normal; color:var(--sn)}
.months{display:flex; gap:8px; margin-top:16px; overflow-x:auto; scrollbar-width:none; padding:2px 2px 10px; margin-inline:-2px}
.months::-webkit-scrollbar{display:none}
.mtab{flex:1 0 auto; max-width:180px; min-width:96px; display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  border:1.5px solid var(--line); background:var(--surface); border-radius:13px; padding:10px 14px 9px; text-align:left}
.mtab .m{font-size:18px; font-weight:900; letter-spacing:-.03em; line-height:1.1}
.mtab .c{font-size:12px; font-weight:700; color:var(--sn); font-variant-numeric:tabular-nums}
.mtab .c.zero{color:var(--faint)}
.mtab:hover{border-color:var(--sn)}
.mtab[aria-pressed="true"]{background:var(--sn); border-color:var(--sn); color:var(--on-accent);
  box-shadow:0 6px 16px -6px var(--sn)}
.mtab[aria-pressed="true"] .c{color:inherit; opacity:.9}
.swipehint{font-size:11.5px; color:var(--muted); margin-top:8px; text-align:center}
@media (min-width:720px){ .swipehint{display:none} }

.controls{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:18px}
.seg{display:flex; background:var(--line-soft); border-radius:11px; padding:3px}
.seg button{border:0; background:transparent; padding:7px 16px; border-radius:8px; font-size:14px; font-weight:700; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(10,33,48,.12)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface);
  padding:6px 11px; border-radius:999px; font-size:13px; font-weight:600; color:var(--muted)}
.chip .sw{width:9px; height:9px; border-radius:3px}
.chip[aria-pressed="true"]{border-color:var(--ink); color:var(--ink); font-weight:700}

.sample{margin-top:14px; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px}
.sample b{background:var(--cta); color:var(--cta-ink); font-size:10.5px; letter-spacing:.08em; padding:2px 7px; border-radius:5px}

/* ---------- slot row (shared by list + calendar detail) ---------- */
.slot{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:4px 12px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 12px}
.slot .when{grid-row:span 2; align-self:stretch; display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:58px; padding:4px 6px; border-radius:8px; background:var(--tint); color:var(--pink); line-height:1.15;
  font-variant-numeric:tabular-nums}
.slot .when small{font-size:10.5px; font-weight:700; opacity:.8}
.slot .when b{font-size:15px; font-weight:900; letter-spacing:-.02em}
.slot.sn{--tint:var(--sn-tint); --pink:var(--sn-ink); --c:var(--sn)}
.slot.yi{--tint:var(--yi-tint); --pink:var(--yi-ink); --c:var(--yi)}
.slot .where{font-weight:700; font-size:14.5px; letter-spacing:-.02em; display:flex; align-items:center; gap:7px; min-width:0}
.slot .where .dot{width:8px; height:8px; border-radius:50%; background:var(--c); flex:none}
.slot .meta{grid-column:2; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
.pips{display:flex; gap:3px}
.pips i{width:9px; height:9px; border-radius:3px; background:var(--c)}
.pips i.taken{background:var(--line)}
.memo{background:var(--line-soft); color:var(--ink); border-radius:5px; padding:1px 6px; font-weight:600}
.slot .act{grid-column:3; grid-row:1 / span 2}
.book{border:0; background:var(--cta); color:var(--cta-ink); font-weight:800; font-size:14px;
  padding:9px 16px; border-radius:9px; letter-spacing:-.01em}
.book:hover{filter:brightness(1.05)}
a.book{text-decoration:none; text-align:center; display:inline-block}
.retry{margin-top:12px; border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:8px 16px; font-weight:700}
.fullbadge{display:inline-block; font-size:13px; font-weight:700; color:var(--faint); padding:9px 12px;
  border:1.5px dashed var(--line); border-radius:9px}
.slot.is-full .where, .slot.is-full .when{opacity:.55}
.grp{background:var(--sn-tint); color:var(--sn-ink); border-radius:5px; padding:1px 7px; font-weight:700; font-size:11.5px}
.mine{background:var(--ink); color:var(--bg); border-radius:5px; padding:1px 7px; font-weight:800; font-size:11.5px}

/* ---------- my bookings ---------- */
.me{display:flex; align-items:center; gap:12px; margin-top:22px; padding:12px 14px; background:var(--surface);
  border:1px solid var(--line); border-radius:12px}
.me .av{width:38px; height:38px; border-radius:50%; flex:none; background:var(--sn-tint); color:var(--sn-ink);
  display:grid; place-items:center; font-weight:900; overflow:hidden}
.me .av img{width:100%; height:100%; object-fit:cover}
.me .who{flex:1; min-width:0; line-height:1.3}
.me .who b{display:block; font-size:15px}
.me .who small{color:var(--muted); font-size:12.5px; overflow-wrap:anywhere}
.ghost.sm{padding:7px 12px; font-size:13px}
.mysec{margin-top:22px}
.mysec h2{font-size:14px; font-weight:800; color:var(--muted); letter-spacing:.02em; margin:0 0 10px}
.mysec .slots{gap:8px}
.slot.past{opacity:.6}
.slot.my-cancel .where, .slot.my-cancel .when{opacity:.5}
.slot.my-cancel .where{text-decoration:line-through}
.stpill{display:inline-block; font-size:12.5px; font-weight:800; padding:6px 11px; border-radius:999px; white-space:nowrap}
.st-ok{background:var(--sn-tint); color:var(--sn-ink)}
.st-wait{background:var(--wait-bg); color:var(--wait-ink)}
.st-cancel{color:var(--faint); border:1.5px dashed var(--line)}
.signin{margin-top:22px; padding:28px 18px; text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:14px}
.signin p{margin:0 0 16px; color:var(--muted); font-size:14px; text-wrap:balance}
.signin #gbtn{display:flex; justify-content:center; min-height:44px}
.myhelp{margin-top:14px; font-size:12.5px; color:var(--muted); line-height:1.6}

/* ---------- list ---------- */
.list{display:flex; flex-direction:column; gap:18px; margin-top:22px}
.day{display:grid; grid-template-columns:54px 1fr; gap:12px}
.dlabel{padding-top:6px; text-align:center}
.dlabel .dn{font-size:26px; font-weight:900; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums}
.dlabel .dw{font-size:12px; font-weight:700; color:var(--muted); margin-top:3px}
.dlabel.sun .dw{color:var(--sun)} .dlabel.sat .dw{color:var(--sat)}
.slots{display:flex; flex-direction:column; gap:8px}
.empty{margin-top:28px; padding:28px 16px; text-align:center; color:var(--muted); border:1.5px dashed var(--line); border-radius:14px}

/* ---------- calendar ---------- */
.cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; margin-top:20px}
.dow{text-align:center; font-size:12px; font-weight:700; color:var(--muted); padding-bottom:4px; letter-spacing:.04em}
.dow.sun{color:var(--sun)} .dow.sat{color:var(--sat)}
.cell{border:1.5px solid var(--line-soft); background:var(--surface); border-radius:10px; min-height:66px;
  padding:6px 4px 5px; display:flex; flex-direction:column; gap:3px; text-align:left; min-width:0}
.cell .n{font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1}
.cell.blank{background:transparent; border-color:transparent}
.cell.past{background:var(--past); border-color:transparent}
.cell.past .n{color:var(--faint)}
.cell.adj{border-style:dashed}
.cell.adj .n{color:var(--muted)}
.cell.has{border-color:var(--line)}
.cell.has:hover{border-color:var(--sn)}
.cell.sel{border-color:var(--ink); border-width:2px; padding:5.5px 3.5px 4.5px}
.cell.off{background:var(--off-bg); border-color:var(--off-line)} .cell.off .n,.cell.off .lbl{color:var(--off-ink)}
.cell.shut{background:var(--shut-bg); border-color:var(--shut-line)} .cell.shut .n,.cell.shut .lbl{color:var(--shut-ink)}
.cell .lbl{font-size:10.5px; font-weight:700; margin-top:auto; line-height:1.2; letter-spacing:-.03em; overflow-wrap:anywhere}
.pill{display:flex; align-items:center; justify-content:space-between; gap:3px; border-radius:5px;
  font-size:10px; font-weight:800; padding:2px 3px; letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--on-accent); line-height:1.25}
.pill.sn{background:var(--sn)} .pill.yi{background:var(--yi)}
.pill.full{background:transparent; color:var(--faint); border:1px dashed var(--line); text-decoration:line-through}
.pill .t{display:none}
.pill .t-mini{white-space:nowrap; margin-inline:auto}
.detail{margin-top:16px}
.detail h2{font-size:16px; font-weight:800; letter-spacing:-.02em; margin:0 0 10px}
.legend{display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--muted)}
.legend span{display:flex; align-items:center; gap:5px}
.legend i{width:11px; height:11px; border-radius:3px; border:1px solid transparent}

@media (min-width:720px){
  .cell{min-height:104px; padding:8px 7px 7px}
  .cell.sel{padding:7.5px 6.5px 6.5px}
  .cell .n{font-size:17px}
  .cell .lbl{font-size:12px}
  .pill{font-size:11.5px; padding:3px 6px}
  .pill .t{display:inline} .pill .t-mini{display:none} .pill{letter-spacing:-.01em}
}

.foot{margin-top:30px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); line-height:1.7}
.foot b{color:var(--ink)}
.foot a{color:var(--sn); font-weight:700}

/* ---------- classes / places / reviews / about ---------- */
.sec{margin-top:26px}
.sec > h2{font-size:17px; font-weight:900; letter-spacing:-.02em; margin:0 0 12px}
.cards{display:grid; gap:12px}
@media (min-width:720px){ .cards.two{grid-template-columns:1fr 1fr} }
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px}
.gsum{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.gsum .score{font-size:44px; font-weight:900; letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums}
.gsum .meta2{flex:1; min-width:140px}
.gsum .btns{display:flex; gap:8px; flex-wrap:wrap; width:100%}
.stars{color:var(--cta); letter-spacing:1px; font-size:15px}
.stars .off{color:var(--line)}
.rv .who{display:flex; align-items:center; gap:10px}
.rv .av{width:34px; height:34px; border-radius:50%; background:var(--sn-tint); color:var(--sn-ink); display:grid; place-items:center;
  font-weight:900; flex:none; overflow:hidden}
.rv .av img{width:100%; height:100%; object-fit:cover}
.rv .nm{font-weight:800; font-size:14.5px; line-height:1.2}
.rv .sub{font-size:12px; color:var(--muted)}
.src{margin-left:auto; font-size:11px; font-weight:800; border-radius:5px; padding:2px 7px; background:var(--line-soft); color:var(--muted); white-space:nowrap}
.src.g{background:var(--yi-tint); color:var(--yi-ink)}
.rv p{margin:10px 0 0; font-size:14.5px; line-height:1.7; white-space:pre-line; overflow-wrap:anywhere}
.attrib{font-size:11.5px; color:var(--muted); margin-top:10px}
.imgs{display:grid; gap:12px; margin-top:20px; max-width:640px; margin-inline:auto}
.imgs img{display:block; width:100%; height:auto; border-radius:14px; border:1px solid var(--line); background:var(--surface)}
.imgph{border:1.5px dashed var(--line); border-radius:14px; padding:56px 18px; text-align:center; color:var(--muted); font-size:14px; background:var(--surface)}

/* ---------- filters (pool / class) ---------- */
.filters{display:flex; flex-direction:column; gap:9px; margin-top:18px}
.fgrp{display:flex; align-items:baseline; gap:8px 10px; flex-wrap:wrap}
.fgrp .chips{flex:1 1 0; min-width:0}
.flabel{font-size:13px; font-weight:800; color:var(--muted); letter-spacing:-.01em; white-space:nowrap; flex:none}
@media (max-width:420px){ .chip{padding:6px 9px; font-size:12.5px} }

/* ---------- classes & instructor ---------- */
.lede{margin:18px 0 0; font-size:14.5px; line-height:1.7; color:var(--muted); text-wrap:pretty}
.cls{margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 16px}
.cls .tag{display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.01em; padding:3px 9px; border-radius:999px;
  background:var(--sn-tint); color:var(--sn-ink)}
.cls h2{font-size:22px; font-weight:900; letter-spacing:-.035em; margin:9px 0 0; line-height:1.15}
.cls .lead{margin:10px 0 0; font-size:15px; line-height:1.75; text-wrap:pretty}
.cls h3{font-size:13px; font-weight:800; color:var(--muted); letter-spacing:.02em; margin:18px 0 8px}
.cls ul{margin:0; padding-left:2px; list-style:none; display:flex; flex-direction:column; gap:6px}
.cls ul li{font-size:14.5px; line-height:1.6; padding-left:15px; position:relative}
.cls ul li::before{content:'·'; position:absolute; left:3px; font-weight:900; color:var(--sn)}
.cls ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:7px}
.cls ol li{font-size:14.5px; line-height:1.6}
.cls ol li::marker{font-weight:900; color:var(--sn)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:7px 14px; margin-top:16px; font-size:14px; line-height:1.6}
.kv dt{color:var(--muted); font-weight:700; white-space:nowrap}
.kv dd{margin:0; overflow-wrap:anywhere}
.pricebox{margin-top:16px; border:1.5px solid var(--sn); border-radius:12px; padding:13px 14px; background:var(--sn-tint)}
.pricebox .ph{font-size:11.5px; font-weight:800; letter-spacing:.1em; color:var(--sn-ink); opacity:.8}
.pricerow{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:8px}
.pricerow span{font-size:14px; color:var(--sn-ink); font-weight:600}
.pricerow b{font-size:16px; font-weight:900; letter-spacing:-.02em; color:var(--sn-ink); font-variant-numeric:tabular-nums; white-space:nowrap}
.pricebox .pnote{margin-top:10px; font-size:12.5px; color:var(--sn-ink); opacity:.85; line-height:1.55}
.callout{margin-top:16px; border-left:3px solid var(--cta); background:var(--line-soft); border-radius:0 9px 9px 0;
  padding:11px 13px; font-size:13.5px; line-height:1.65}
.callout b{font-weight:800}
.tbl{width:100%; border-collapse:collapse; margin-top:12px; font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line); padding:10px 8px; text-align:left; vertical-align:top}
.tbl th{font-size:12px; font-weight:800; color:var(--muted); letter-spacing:.02em; white-space:nowrap}
.tbl td.num{text-align:right; font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap}
.tbl td small{display:block; color:var(--muted); font-weight:400; font-size:12px; margin-top:3px}
.maplink{color:var(--sn); font-weight:700; text-decoration:none; font-size:12.5px; white-space:nowrap}
.photo{margin-top:16px; border:1.5px dashed var(--line); border-radius:13px; padding:34px 16px; text-align:center;
  color:var(--faint); font-size:13px; font-weight:700; background:var(--bg)}
.bio{margin-top:20px}
.bio p{margin:0 0 12px; font-size:15.5px; line-height:1.8; text-wrap:pretty}
.bio p.sig{font-size:19px; font-weight:900; letter-spacing:-.03em; margin-bottom:16px}

/* ---------- loading: freediver doing dynamic with a monofin ---------- */
.loader{margin-top:26px; padding:18px 12px 20px; border-radius:16px; background:var(--sn-tint); text-align:center; overflow:hidden}
.loader svg{display:block; width:100%; max-width:420px; height:auto; margin:0 auto; overflow:visible}
.loader .surf{fill:none; stroke:var(--sn); stroke-width:1.6; opacity:.45}
.loader .floor{stroke:var(--sn); stroke-width:2; stroke-dasharray:14 10; opacity:.3}
.loader .head{fill:var(--sn-ink)}
.loader .body{stroke:var(--sn-ink); stroke-width:9; stroke-linecap:round}
.loader .arm{stroke:var(--sn-ink); stroke-width:3.4; stroke-linecap:round}
.loader .leg{stroke:var(--sn-ink); stroke-width:6; stroke-linecap:round}
.loader .fin{fill:var(--sn)}
.loader .bubbles circle{fill:none; stroke:var(--sn); stroke-width:1.2; opacity:0}
.ltxt{margin-top:10px; font-size:13.5px; font-weight:700; color:var(--sn-ink)}
@media (prefers-reduced-motion:no-preference){
  .loader .swim{animation:swim 3.6s linear infinite}
  .loader .bob{animation:bob .9s ease-in-out infinite}
  .loader .kick{animation:kick .9s ease-in-out infinite}
  .loader .surf{animation:surf 2.4s linear infinite}
  .loader .bubbles{animation:trail 3.6s linear infinite}
  .loader .bubbles circle{animation:rise 1.2s ease-out infinite}
  .loader .bubbles circle:nth-child(2){animation-delay:.35s}
  .loader .bubbles circle:nth-child(3){animation-delay:.7s}
  @keyframes swim{from{transform:translateX(-90px)} to{transform:translateX(260px)}}
  @keyframes bob{0%,100%{transform:translateY(-2px)} 50%{transform:translateY(2px)}}
  @keyframes kick{0%,100%{transform:rotate(-13deg)} 50%{transform:rotate(13deg)}}
  @keyframes surf{from{transform:translateX(0)} to{transform:translateX(-32px)}}
  @keyframes trail{from{transform:translate(-30px,44px)} to{transform:translate(320px,44px)}}
  @keyframes rise{0%{opacity:.8; transform:translateY(0)} 100%{opacity:0; transform:translateY(-26px)}}
}
@media (prefers-reduced-motion:reduce){ .loader .swim{transform:translateX(70px)} }

/* ---------- bottom sheet ---------- */
.scrim{position:fixed; inset:0; background:rgba(6,20,28,.45); display:flex; align-items:flex-end; justify-content:center; z-index:10}
.sheet{background:var(--surface); width:100%; max-width:480px; border-radius:18px 18px 0 0; box-shadow:var(--shadow);
  padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:560px){ .scrim{align-items:center} .sheet{border-radius:18px} }
.sheet .grab{width:38px; height:4px; border-radius:2px; background:var(--line); margin:-6px auto 14px}
.sheet h3{margin:0; font-size:20px; font-weight:900; letter-spacing:-.03em}
.sheet dl{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:14px 0 0; font-size:14px}
.sheet dt{color:var(--muted); font-weight:600}
.sheet dd{margin:0; font-weight:700}
.prefill{margin-top:14px; font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--muted);
  background:var(--line-soft); border-radius:8px; padding:9px 10px; overflow-wrap:anywhere}
.sheet .row{display:flex; gap:8px; margin-top:16px}
.sheet .row .book{flex:1; padding:13px}
.ghost{border:1px solid var(--line); background:transparent; border-radius:9px; padding:13px 16px; font-weight:700; color:var(--muted)}
.sheet .fine{font-size:12px; color:var(--muted); margin-top:10px}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); font-size:13.5px; font-weight:600; padding:11px 16px; border-radius:10px;
  z-index:20; max-width:calc(100% - 32px); box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px); opacity:.6}}
}

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const key = dt => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const monthOf = dt => new Date(dt.getFullYear(), dt.getMonth(), 1);
const addMonths = (m,n) => new Date(m.getFullYear(), m.getMonth()+n, 1);
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} },
                set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };

const now = new Date(); now.setHours(0,0,0,0);
const TODAY = key(now);
const firstMonth = monthOf(now);

let DATA = [];          // 슬롯 {d,s,t,p,cap,bk,memo} + 외부일정 {d,st:'off'}
let FORM = null;        // {url, entry} — 시트 연결 시 Apps Script 가 알려줌
let MODE = 'loading';   // loading | sample | live | error
let USER = null;        // {name,email,picture,cred,exp} — 구글 로그인
let MY = null;          // 내 예약 목록
let MYSTATE = 'idle';   // idle | loading | ok | error
let CONTENT = null;     // 후기 (시트 후기 + 구글 후기)
let gisReady = false;

const uiLang = () => {
  const ls = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language||'ko']);
  return ls.some(l => String(l).toLowerCase().startsWith('ko')) ? 'ko' : 'en';
};

const state = {
  lang: store.get('aloha.lang') || uiLang(),
  page: 'schedule',      // schedule | classes | reviews | about | my  (주소 뒤 #classes 처럼 링크 가능)
  place: null,           // null = 다이빙풀 전체
  cls: null,             // null = 수업 전체
  month: firstMonth,
  sel: null,
};

/* 아쿠아라인 정기휴무: 매달 2·4번째 일요일 */
const aqClosed = dt => dt.getDay()===0 && [2,4].includes(Math.ceil(dt.getDate()/7));

const slotId = r => r.id || `${r.d.replace(/-/g,'')}-${r.s}-${r.p}`;
const placeOk = r => !state.place || r.p===state.place;
/* 슬롯에 수업이 안 적혀 있으면 어느 수업을 골라도 보임 */
const classOk = r => !state.cls || !r.c || !r.c.length || r.c.indexOf(state.cls)>=0;
const shown = r => placeOk(r) && classOk(r);
const slotsOn = k => DATA.filter(r => r.d===k && r.s && shown(r)).sort((a,b)=> (a.t[0]).localeCompare(b.t[0]));
const isOff = k => DATA.some(r => r.d===k && r.st==='off');
const inMonth = (d, m) => d.startsWith(`${m.getFullYear()}-${pad(m.getMonth()+1)}`);

function monthList(){
  const last = DATA.reduce((a,r)=> r.d>a ? r.d : a, TODAY);
  const cap = addMonths(firstMonth, Math.max(0, CONFIG.MONTHS_AHEAD|0));
  let end = monthOf(parse(last)); if(end > cap) end = cap;
  const out = [];
  for(let m=firstMonth; m<=end; m=addMonths(m,1)) out.push(m);
  return out;
}
const seatsIn = m => DATA.filter(r=> r.s && inMonth(r.d,m) && r.d>=TODAY && shown(r))
                         .reduce((a,r)=> a + Math.max(0, r.cap-r.bk), 0);

function slotHTML(r){
  const t = T[state.lang], left = r.cap - r.bk, full = left<=0;
  const pips = Array.from({length:r.cap}, (_,i)=> `<i class="${i<r.bk?'taken':''}"></i>`).join('');
  const memo = r.memo ? `<span class="memo">${r.memo[state.lang]}</span>` : '';
  const mine = myIds().has(slotId(r)) ? `<span class="mine">${t.booked}</span>` : '';
  const grp = r.bk===0 && r.cap>=3 ? `<span class="grp">${t.group}</span>` : '';
  const act = full ? `<span class="fullbadge">${t.full}</span>`
                   : `<button class="book" data-id="${DATA.indexOf(r)}">${t.book}</button>`;
  return `<div class="slot ${r.p}${full?' is-full':''}">
    <div class="when"><small>${t.slot[r.s]}</small><b>${r.t[0]}</b><small>~${r.t[1]}</small></div>
    <div class="where"><span class="dot"></span>${t.place[r.p]}</div>
    <div class="meta"><span class="pips" aria-hidden="true">${pips}</span><span>${full? t.full : t.left(left)}</span>${mine}${grp}${memo}</div>
    <div class="act">${act}</div></div>`;
}

/* 달력은 그 달 1일이 있는 주의 일요일 ~ 말일이 있는 주의 토요일까지 */
function calRange(m){
  const y = m.getFullYear(), mo = m.getMonth(), last = new Date(y,mo+1,0);
  return [new Date(y,mo,1-new Date(y,mo,1).getDay()), new Date(y,mo,last.getDate()+6-last.getDay())];
}

function renderCal(){
  const t = T[state.lang], m = state.month, [start,end] = calRange(m);
  let h = `<div class="cal">` + t.dow.map((d,i)=>`<div class="dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('');
  for(let dt=new Date(start); dt<=end; dt.setDate(dt.getDate()+1)){
    const k = key(dt), ss = slotsOn(k), adj = dt.getMonth()!==m.getMonth();
    const num = adj && dt.getDate()===1 ? `${dt.getMonth()+1}/1` : dt.getDate();
    const cls = adj ? ' adj' : '';
    if(k < TODAY){ h += `<div class="cell past${cls}"><span class="n">${num}</span></div>`; continue; }
    if(ss.length){
      const pills = ss.map(r=>{ const left=r.cap-r.bk;
        return left>0
          ? `<span class="pill ${r.p}"><span class="t">${r.t[0]} ${t.short[r.p]}</span><span class="t-mini">${r.t[0]}</span><span class="t">${left}</span></span>`
          : `<span class="pill full"><span class="t">${r.t[0]} ${t.short[r.p]}</span><span class="t-mini">${r.t[0]}</span></span>`;
      }).join('');
      h += `<button class="cell has${cls}${state.sel===k?' sel':''}" data-day="${k}" aria-label="${t.date(dt)}"><span class="n">${num}</span>${pills}</button>`;
    } else if(isOff(k)){
      h += `<div class="cell off${cls}"><span class="n">${num}</span><span class="lbl">${t.off}</span></div>`;
    } else if(aqClosed(dt) && state.place!=='yi'){
      h += `<div class="cell shut${cls}"><span class="n">${num}</span><span class="lbl">${t.shut}</span></div>`;
    } else {
      h += `<div class="cell${cls}"><span class="n">${num}</span></div>`;
    }
  }
  h += `</div>` + (monthList().length>1 ? `<div class="swipehint">${t.swipe}</div>` : '');
  h += `<div class="legend">
    <span><i style="background:var(--sn)"></i>${t.legend.sn}</span>
    <span><i style="background:var(--yi)"></i>${t.legend.yi}</span>
    <span><i style="background:var(--off-bg);border-color:var(--off-line)"></i>${t.legend.off}</span>
    <span><i style="background:var(--shut-bg);border-color:var(--shut-line)"></i>${t.legend.shut}</span></div>`;
  const sel = state.sel;
  h += `<div class="detail">` + (sel
      ? `<h2>${t.date(parse(sel))}</h2><div class="slots">${slotsOn(sel).map(slotHTML).join('') || `<div class="empty">${t.noslot}</div>`}</div>`
      : `<div class="empty">${t.pick}</div>`) + `</div>`;
  return h;
}

const myOn = () => MODE==='sample' || !!CONFIG.CLIENT_ID;
const myList = () => MODE==='sample' ? SAMPLE_MY : (MY || []);
const myIds = () => new Set(myList().filter(b => b.st!=='cancel').map(b => b.id));

function bookingHTML(b){
  const t = T[state.lang], past = b.d < TODAY;
  const when = b.t ? `<small>${t.slot[b.s]}</small><b>${b.t[0]}</b><small>~${b.t[1]}</small>` : `<b>${t.slot[b.s]}</b>`;
  const memo = b.memo ? `<span class="memo">${b.memo[state.lang]}</span>` : '';
  return `<div class="slot ${b.p} my-${b.st}${past?' past':''}">
    <div class="when">${when}</div>
    <div class="where"><span class="dot"></span>${t.date(parse(b.d))}</div>
    <div class="meta"><span>${t.place[b.p]}</span><span>· ${t.people(b.n)}</span>${memo}</div>
    <div class="act"><span class="stpill st-${b.st}">${t.st[b.st]}</span></div></div>`;
}

function renderMy(){
  const t = T[state.lang];
  const user = MODE==='sample' ? SAMPLE_USER : USER;
  if(!user){
    return `<div class="signin"><p>${t.myIntro}</p><div id="gbtn">${gisReady?'':t.loading}</div></div>`;
  }
  const av = user.picture ? `<img src="${user.picture}" alt="" referrerpolicy="no-referrer">` : (user.name||'?').slice(0,1);
  let h = `<div class="me"><div class="av">${av}</div><div class="who"><b>${user.name||''}</b><small>${user.email}</small></div>
    <button class="ghost sm" id="logout">${t.logout}</button></div>`;
  if(MODE!=='sample' && MYSTATE==='loading') return h + loaderHTML(t.loading);
  if(MODE!=='sample' && MYSTATE==='error') return h + `<div class="empty">${t.myErr}</div>`;
  const list = myList();
  if(!list.length) return h + `<div class="empty">${t.myEmpty}</div><div class="myhelp">${t.myHelp}</div>`;
  const up = list.filter(b => b.d >= TODAY), past = list.filter(b => b.d < TODAY).reverse();
  if(up.length) h += `<section class="mysec"><h2>${t.myUp}</h2><div class="slots">${up.map(bookingHTML).join('')}</div></section>`;
  if(past.length) h += `<section class="mysec"><h2>${t.myPast}</h2><div class="slots">${past.map(bookingHTML).join('')}</div></section>`;
  return h + `<div class="myhelp">${t.myHelp}</div>`;
}

const ICONS = {

  reviews:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3l-5.5 2.9 1-6.2L3 9.6l6.2-.9z"/>',
  about:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.4-4 4.4-6 8-6s6.6 2 8 6"/>',

};
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https:\/\//i.test(String(u||'').trim()) ? String(u).trim() : '';
const L = o => o ? (o[state.lang] || o.ko || '') : '';
const content = () => MODE==='sample' ? SAMPLE_CONTENT : CONTENT;
const starsHTML = n => { n = Math.round(n||0); return `<span class="stars" aria-label="${n}/5">${'★'.repeat(n)}<span class="off">${'★'.repeat(5-n)}</span></span>`; };

function renderReviews(){
  const t = T[state.lang], c = content();
  if(!c) return `<div class="empty">${t.notReady}</div>`;
  const g = c.google;
  let h = '';
  if(g && (g.count || (g.reviews||[]).length)){
    const all = safeUrl(g.url), write = safeUrl(g.write);
    h += `<section class="sec"><div class="card gsum">
      <div class="score">${g.rating ? Number(g.rating).toFixed(1) : '–'}</div>
      <div class="meta2"><div>${starsHTML(g.rating)}</div><div class="sub">${t.gTitle} · ${t.gCount(g.count||0)}</div></div>
      ${all||write ? `<div class="btns">${write?`<a class="book" href="${esc(write)}" target="_blank" rel="noopener">${t.gWrite}</a>`:''}${all?`<a class="linkbtn" href="${esc(all)}" target="_blank" rel="noopener">${t.gAll} ↗</a>`:''}</div>` : ''}
    </div>`;
    if((g.reviews||[]).length){
      h += `<div class="cards" style="margin-top:12px">` + g.reviews.map(r => {
        const ph = safeUrl(r.photo);
        return `<article class="card rv"><div class="who">
          <div class="av">${ph?`<img src="${esc(ph)}" alt="" referrerpolicy="no-referrer">`:esc((r.author||'?').slice(0,1))}</div>
          <div><div class="nm">${esc(r.author)}</div><div class="sub">${starsHTML(r.rating)} · ${esc(r.when)}</div></div>
          <span class="src g">Google</span></div>
          ${r.text?`<p>${esc(r.text)}</p>`:''}</article>`;
      }).join('') + `</div><div class="attrib">${t.gAttrib}</div>`;
    }
    h += `</section>`;
  }
  if((c.reviews||[]).length){
    h += `<section class="sec"><h2>${t.rvOthers}</h2><div class="cards">` + c.reviews.map(r => `<article class="card rv"><div class="who">
      <div class="av">${esc((r.name||'?').slice(0,1))}</div>
      <div><div class="nm">${esc(r.name)}</div><div class="sub">${starsHTML(r.stars)}${r.date?` · ${esc(r.date)}`:''}</div></div>
      ${r.src?`<span class="src">${esc(r.src)}</span>`:''}</div>
      <p>${esc(r.text)}</p></article>`).join('') + `</div></section>`;
  }
  return h || `<div class="empty">${t.rvEmpty}</div>`;
}

function renderImages(pg){
  const t = T[state.lang], files = (CONFIG.IMAGES && CONFIG.IMAGES[pg]) || [];
  if(MODE==='sample' || !files.length){
    return `<div class="imgs">${(files.length?files:['—']).map(f=>`<div class="imgph">${t.imgSample(f)}</div>`).join('')}</div>`;
  }
  return `<div class="imgs">${files.map(f=>`<img src="${esc(f)}" alt="${esc(t.nav[pg])}" loading="lazy" onerror="this.outerHTML='<div class=&quot;imgph&quot;>${esc(t.imgMissing)}</div>'">`).join('')}</div>`;
}

/* 사진 자리 — CONFIG.IMAGES 에 파일 이름을 넣으면 그 자리에 사진이 들어감 */
function photoSlot(files, i, alt){
  const t = T[state.lang], f = files[i];
  if(!f) return `<div class="photo">${t.photoSlot}</div>`;
  return `<img src="${esc(f)}" alt="${esc(alt)}" loading="lazy" style="display:block;width:100%;height:auto;border-radius:13px;margin-top:16px;border:1px solid var(--line)"
    onerror="this.outerHTML='<div class=&quot;photo&quot;>${esc(t.photoSlot)}</div>'">`;
}

function classCard(it, files, i){
  const t = T[state.lang];
  let h = `<section class="cls" id="cls-${it.key}"><span class="tag">${it.tag}</span><h2>${it.name}</h2>`;
  h += it.lead.map(p=>`<p class="lead">${p}</p>`).join('');
  if(it.steps) h += `<h3>${it.stepsH}</h3><ol>${it.steps.map(x=>`<li>${x}</li>`).join('')}</ol>`;
  if(it.learn) h += `<h3>${it.learnH}</h3><ul>${it.learn.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(it.callout) h += `<div class="callout">${it.callout}</div>`;
  h += `<dl class="kv">${it.rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl>`;
  h += `<div class="pricebox">` + (it.price.length ? `<div class="ph">${t.priceH}</div>` : '') +
       it.price.map(r=>`<div class="pricerow"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('') +
       (it.pnote?`<div class="pnote"${it.price.length?'':' style="margin-top:0;font-weight:700"'}>${it.pnote}</div>`:'') + `</div>`;
  h += photoSlot(files, i, it.name);
  h += `<button class="book" data-page="schedule" style="margin-top:16px">${t.cGo}</button></section>`;
  return h;
}

function renderClasses(){
  const t = T[state.lang], d = DOC[state.lang];
  const files = (CONFIG.IMAGES && CONFIG.IMAGES.classes) || [];
  let h = `<p class="lede">${d.intro}</p>`;
  h += d.items.map((it,i)=> classCard(it, files, i)).join('');
  h += `<section class="sec"><h2>${d.venueH}</h2><p class="lede" style="margin-top:6px">${d.venueSub}</p>
    <table class="tbl"><thead><tr><th>${t.dl[2]}</th><th>${t.weekday}</th><th>${t.weekend}</th></tr></thead><tbody>` +
    d.venues.map(v=>`<tr><td>${v.name}<small>${v.addr} · <a class="maplink" href="${mapUrl(v.addr)}" target="_blank" rel="noopener">${t.mapGo} ↗</a></small></td>
      <td class="num">${v.wd}</td><td class="num">${v.we}</td></tr>`).join('') +
    `</tbody></table><div class="callout">${d.venueNote}</div></section>`;
  h += `<section class="sec"><h2>${d.bringH}</h2><div class="cls" style="margin-top:0"><ul>` +
    d.bring.map(x=>`<li>${x}</li>`).join('') + `</ul><div class="callout">${d.bringNote}</div></div></section>`;
  return h;
}

function renderAbout(){
  const t = T[state.lang], a = DOC[state.lang].about;
  const files = (CONFIG.IMAGES && CONFIG.IMAGES.about) || [];
  let h = photoSlot(files, 0, a.name).replace('margin-top:16px','margin-top:4px');
  h += `<div class="bio"><p class="sig">${a.name}</p>` + a.bio.map(p=>`<p>${p}</p>`).join('') + `</div>`;
  h += `<section class="cls"><h3 style="margin-top:0">${a.forH}</h3><ul>` + a.forYou.map(x=>`<li>${x}</li>`).join('') + `</ul>
    <div class="callout">${a.after}</div></section>`;
  h += `<section class="cls"><h3 style="margin-top:0">${a.certH}</h3><ul>` + a.certs.map(x=>`<li>${x}</li>`).join('') + `</ul></section>`;
  h += `<section class="cls"><h3 style="margin-top:0">${a.contactH}</h3><dl class="kv" style="margin-top:0">
    <dt>${t.insta}</dt><dd><a class="maplink" href="${INSTA}" target="_blank" rel="noopener">${a.insta} ↗</a></dd>
    <dt>${t.kakao}</dt><dd>${a.kakao}</dd></dl></section>`;
  return h;

function setPage(p, push){

  if(push !== false){ try{ history.replaceState(null, '', p==='schedule' ? location.pathname + location.search : '#'+p); }catch(e){} }

function firstOpenDay(){
  const [start,end] = calRange(state.month).map(key);
  const days = DATA.filter(r=> r.s && r.d>=start && r.d<=end && r.d>=TODAY && r.cap>r.bk && shown(r))
                   .map(r=>r.d).sort();
  return days.find(d => inMonth(d,state.month)) || days[0] || null;
}

function render(){
  const t = T[state.lang], m = state.month;
  document.documentElement.lang = state.lang;
  $('eyebrow').textContent = t.eyebrow;
  if(state.page==='my' && !myOn()) state.page = 'schedule';
  const pg = state.page;
  $('title').innerHTML = pg==='schedule' ? t.month(m.getFullYear(), m.getMonth()+1) : pg==='my' ? t.myTitle : t.ttl[pg];
  $('tabbar').innerHTML = PAGES.filter(p => p!=='my' || myOn()).map(p =>
    `<button data-page="${p}"${p===pg?' aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[p]}</svg><span>${t.nav[p]}</span></button>`).join('');
  $('lang-ko').setAttribute('aria-pressed', state.lang==='ko');
  $('lang-en').setAttribute('aria-pressed', state.lang==='en');
  const isMy = pg==='my';
  $('schedctl').hidden = pg!=='schedule';
  $('lab-place').textContent = t.fPlace + ' :';
  $('lab-class').textContent = t.fClass + ' :';
  $('chips-place').innerHTML = ['sn','yi'].map(p=>
    `<button class="chip" data-place="${p}" aria-pressed="${state.place===p}"><span class="sw" style="background:var(--${p})"></span>${t.place[p]}</button>`).join('');
  $('chips-class').innerHTML = CLASS_KEYS[state.lang].map(c=>
    `<button class="chip" data-cls="${c}" aria-pressed="${state.cls===c}">${t.cls[c]}</button>`).join('');
  $('sample').hidden = MODE!=='sample';
  $('sampletag').textContent = t.sampletag; $('sampletxt').textContent = t.sampletxt;
  $('foot').innerHTML = pg==='schedule' ? t.foot : t.footMini;

  if(pg==='classes'){ $('main').innerHTML = renderClasses(); return; }
  if(pg==='about'){ $('main').innerHTML = renderAbout(); return; }
  if(MODE==='loading'){ $('months').innerHTML=''; $('main').innerHTML = loaderHTML(t.loading); return; }
  if(MODE==='error'){ $('months').innerHTML=''; $('main').innerHTML = `<div class="empty">${t.error}<br><button class="retry" id="retry">${t.retry}</button></div>`; return; }

  const ms = monthList();
  $('months').hidden = ms.length < 2;
  $('months').innerHTML = ms.map(mm=>{
    const n = seatsIn(mm), on = +mm===+m;
    return `<button class="mtab" data-month="${key(mm)}" aria-pressed="${on}"><span class="m">${t.mtab(mm.getFullYear(), mm.getMonth()+1)}</span><span class="c${n?'':' zero'}">${t.seats(n)}</span></button>`;
  }).join('');
  if(pg==='classes'){ $('main').innerHTML = renderClasses(); return; }
  if(pg==='reviews'){ $('main').innerHTML = renderReviews(); return; }
  if(pg==='about'){ $('main').innerHTML = renderAbout(); return; }
  const [cstart,cend] = calRange(m).map(key);
  if(!state.sel || state.sel<cstart || state.sel>cend) state.sel = firstOpenDay();
  $('main').innerHTML = isMy ? renderMy() : renderCal();
  if(isMy) showGoogleButton();
}

function setMonth(mm){
  const ms = monthList();
  if(mm < ms[0] || mm > ms[ms.length-1]) return;
  state.month = mm; state.sel = null; render();
  const tab = document.querySelector('.mtab[aria-pressed="true"]');
  if(tab) tab.scrollIntoView({block:'nearest', inline:'nearest'});
}

function openSheet(r){
  const t = T[state.lang], left = r.cap - r.bk;

  if(state.cls) rows.splice(3, 0, [t.dl[6], t.cls[state.cls]]);

/* ---------- 구글 로그인 (마이페이지) ---------- */
function decodeJwt(c){
  const b = c.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), ch => ch.charCodeAt(0))));
}
let prompted = false;
function showGoogleButton(){
  const el = $('gbtn'); if(!el || !gisReady) return;
  el.innerHTML = '';
  google.accounts.id.renderButton(el, {theme:'outline', size:'large', shape:'pill', text:'signin_with', locale:state.lang});
  if(!prompted){ prompted = true; google.accounts.id.prompt(); }
}
function initGIS(){
  if(!window.google || !google.accounts || !google.accounts.id) return;
  google.accounts.id.initialize({client_id:CONFIG.CLIENT_ID, callback:onCredential, auto_select:true, cancel_on_tap_outside:true});
  gisReady = true;
  if(state.page==='my') render();
}
function onCredential(resp){
  const p = decodeJwt(resp.credential);
  USER = {name:p.name, email:p.email, picture:p.picture, cred:resp.credential, exp:p.exp*1000};
  store.set('aloha.user', JSON.stringify(USER));
  loadMy();
}
function signOut(){
  USER = null; MY = null; MYSTATE = 'idle';
  try{ localStorage.removeItem('aloha.user'); }catch(e){}
  if(gisReady) google.accounts.id.disableAutoSelect();
  render();
}
async function loadMy(quiet){
  if(MODE==='sample' || !CONFIG.API) return;
  if(!USER || USER.exp < Date.now()+30000){ if(USER) signOut(); return; }
  if(!quiet){ MYSTATE = 'loading'; render(); }
  try{
    const res = await fetch(CONFIG.API, {method:'POST', body:JSON.stringify({action:'my', idToken:USER.cred})});
    const j = await res.json();
    if(j.error==='auth'){ signOut(); return; }
    if(j.error) throw new Error(j.error);
    MY = j.bookings; MYSTATE = 'ok';
  }catch(e){
    if(quiet) return;
    MYSTATE = 'error';
  }
  render();
}
function restoreUser(){
  try{ const u = JSON.parse(store.get('aloha.user')||'null'); if(u && u.exp > Date.now()+30000) USER = u; }catch(e){}
}

async function load(quiet){
  if(!CONFIG.API){ DATA = SAMPLE; CONTENT = SAMPLE_CONTENT; MODE = 'sample'; render(); return; }
  if(!quiet){ MODE = 'loading'; render(); }
  try{
    const res = await fetch(CONFIG.API, {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    const j = await res.json();
    DATA = [...j.slots, ...j.off.map(d => ({d, st:'off'}))];
    FORM = j.form && j.form.url && j.form.entry ? j.form : null;
    CONTENT = j.content || null;
    MODE = 'live';
  }catch(e){
    if(quiet) return;
    MODE = 'error';
  }
  render();
}

document.addEventListener('click', e=>{
  const go = e.target.closest('#sh-go');
  if(go){ if(go.dataset.mock){ e.preventDefault(); toast(T[state.lang].toast); } closeSheet(); return; }
  const b = e.target.closest('button'); if(!b) { if(e.target.id==='scrim') closeSheet(); return; }
  if(b.dataset.lang){ state.lang=b.dataset.lang; store.set('aloha.lang',state.lang);
    if(state.cls && CLASS_KEYS[state.lang].indexOf(state.cls)<0) state.cls = null;
    render(); }
  else if(b.dataset.page){ setPage(b.dataset.page); }
  else if(b.dataset.place){ state.place = state.place===b.dataset.place ? null : b.dataset.place; state.sel=null; render(); }
  else if(b.dataset.cls){ state.cls = state.cls===b.dataset.cls ? null : b.dataset.cls; state.sel=null; render(); }
  else if(b.dataset.month){ setMonth(parse(b.dataset.month)); }
  else if(b.dataset.day){ state.sel=b.dataset.day; render(); }
  else if(b.dataset.id){ openSheet(DATA[+b.dataset.id]); }
  else if(b.id==='retry'){ load(); }
  else if(b.id==='logout'){ signOut(); }
  else if(b.id==='sh-close'){ closeSheet(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

/* 달력 좌우로 밀어서 달 넘기기 */
let sx = null, sy = 0;
$('main').addEventListener('touchstart', e=>{ const p=e.touches[0]; sx=p.clientX; sy=p.clientY; }, {passive:true});
$('main').addEventListener('touchend', e=>{
  if(sx===null || state.page!=='schedule' || monthList().length<2) return;
  const p = e.changedTouches[0], dx = p.clientX-sx, dy = p.clientY-sy; sx = null;
  if(Math.abs(dx)>60 && Math.abs(dy)<40) setMonth(addMonths(state.month, dx<0 ? 1 : -1));
});

/* 신청서 탭에서 돌아오면 잔여석 새로 읽기 */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden || MODE!=='live') return;
  load(true); if(USER) loadMy(true);
});

if(CONFIG.CLIENT_ID){
  restoreUser();
  const g = document.createElement('script');
  g.src = 'https://accounts.google.com/gsi/client'; g.async = true; g.onload = initGIS;
  document.head.appendChild(g);
}
window.addEventListener('hashchange', () => setPage(location.hash.slice(1) || 'schedule', false));
state.page = PAGES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'schedule';
load().then(() => { if(USER) loadMy(true); });
</script>
